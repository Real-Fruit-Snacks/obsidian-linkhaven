name: Feature request
description: Suggest an idea for Linkhaven
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and the problem it solves for you.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where would you use it?
      options:
        - Both desktop and mobile
        - Desktop only
        - Mobile only
    validations:
      required: true
